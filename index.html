<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Newsreader:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f8f8f6;
    --ink: #1e1e1e;
    --blue: #1f38a8;
    --nav-active: #224590;
    --body-text: #3b3b3f;
    --pill-bg: #fcfcfa;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  .page {
    position: relative;
    min-height: 100vh;
    overflow: hidden;
  }

  /* decorative grid pattern */
  .bg-grid {
    position: absolute;
    top: 0;
    left: 39px;
    width: 1354px;
    max-width: calc(100% - 39px);
    height: 812px;
    pointer-events: none;
    z-index: 0;
  }

  /* ---------- Nav ---------- */
  .nav {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 72px;
    padding: 24px clamp(24px, 8vw, 120px);
  }

  .logo {
    font-family: 'Newsreader', serif;
    font-weight: 400;
    font-size: 22px;
    color: var(--ink);
    white-space: nowrap;
  }

  .logo .dot { color: var(--blue); }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 48px;
    font-size: 16px;
    line-height: 20px;
    white-space: nowrap;
  }

  .nav-links a {
    text-decoration: none;
    color: #000;
    font-weight: 400;
    position: relative;
    cursor: pointer;
    transition: color 0.15s ease;
  }

  .nav-links a:hover {
    color: var(--nav-active);
  }

  .nav-links a.active {
    color: var(--nav-active);
    font-weight: 500;
  }

  .nav-links a.active::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: -8px;
    height: 1px;
    background: var(--blue);
  }

  /* ---------- Hero ---------- */
  .hero {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 130px 24px 0;
  }

  .hero h1 {
    font-family: 'Newsreader', serif;
    font-weight: 400;
    font-size: 32px;
    line-height: 42px;
    color: #000;
    margin: 0 0 24px;
  }

  .hero p {
    font-family: 'Newsreader', serif;
    font-weight: 400;
    font-size: 28px;
    line-height: 42px;
    color: var(--body-text);
    max-width: 862px;
    margin: 0;
  }

  .hero p .highlight { color: var(--blue); }

  /* ---------- Scroll indicator ---------- */
  .scroll-indicator {
    position: absolute;
    z-index: 2;
    left: 50%;
    bottom: 51px;
    transform: translateX(-50%);
    width: 24px;
    height: 24px;
  }

  .scroll-indicator svg { display: block; }

  .scroll-dot {
    animation: scrollDot 0.912266s linear infinite alternate;
    transform-box: fill-box;
    transform-origin: center;
  }

  @keyframes scrollDot {
    0%   { transform: translateY(0); }
    100% { transform: translateY(8px); }
  }

  /* ---------- Floating toolbar ---------- */
  .toolbar {
    position: fixed;
    z-index: 3;
    right: clamp(24px, 8vw, 120px);
    bottom: 24px;
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 16px 24px;
    border-radius: 16px;
    background: var(--pill-bg);
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
  }

  .toolbar button {
    all: unset;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    cursor: pointer;
    color: #000;
    border-radius: 6px;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  .toolbar button:hover {
    background: rgba(31, 56, 168, 0.08);
  }

  .toolbar button:active {
    transform: scale(0.92);
  }

  .toolbar button.is-active {
    color: var(--blue);
    background: rgba(31, 56, 168, 0.1);
  }

  .toolbar svg { display: block; width: 100%; height: 100%; }
  .toolbar svg path { stroke: currentColor; }
  .toolbar svg path[fill="black"] { fill: currentColor; }

  body.text-large { font-size: 112.5%; }
  body.text-larger { font-size: 125%; }

  body.dark {
    --bg: #17181c;
    --ink: #f2f2f0;
    --body-text: #c9c9cf;
    --pill-bg: #22242a;
  }
  body.dark .hero h1,
  body.dark .nav-links a { color: #f2f2f0; }
  body.dark .toolbar button { color: #f2f2f0; }
  body.dark .toolbar button.is-active { color: #6c8bff; background: rgba(108, 139, 255, 0.15); }
  body.dark .bg-grid path { fill: #6c8bff; }

  @media (max-width: 640px) {
    .nav-links { gap: 24px; font-size: 14px; }
    .hero h1 { font-size: 26px; line-height: 34px; }
    .hero p { font-size: 20px; line-height: 32px; }
    .toolbar { padding: 12px 16px; gap: 14px; }
  }
</style>
</head>

<script>
  // Text size: cycles normal -> large -> larger -> normal
  var sizeSteps = ['', 'text-large', 'text-larger'];
  var sizeIndex = 0;
  document.getElementById('btn-text-size').addEventListener('click', function (e) {
    sizeIndex = (sizeIndex + 1) % sizeSteps.length;
    document.body.classList.remove('text-large', 'text-larger');
    if (sizeSteps[sizeIndex]) document.body.classList.add(sizeSteps[sizeIndex]);
    e.currentTarget.classList.toggle('is-active', sizeIndex !== 0);
  });

  // Theme: toggle dark mode
  document.getElementById('btn-theme').addEventListener('click', function (e) {
    document.body.classList.toggle('dark');
    e.currentTarget.classList.toggle('is-active', document.body.classList.contains('dark'));
  });

  // Audio: read the hero copy aloud via the browser's speech synthesis
  var audioBtn = document.getElementById('btn-audio');
  audioBtn.addEventListener('click', function () {
    if (!('speechSynthesis' in window)) return;
    if (window.speechSynthesis.speaking) {
      window.speechSynthesis.cancel();
      audioBtn.classList.remove('is-active');
      return;
    }
    var text = document.querySelector('.hero').innerText;
    var utterance = new SpeechSynthesisUtterance(text);
    utterance.onend = function () { audioBtn.classList.remove('is-active'); };
    audioBtn.classList.add('is-active');
    window.speechSynthesis.speak(utterance);
  });
</script>
